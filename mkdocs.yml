site_name: exoatlas
site_url: https://zkbt.github.com/exoatlas
nav:
- index.md
- installation.ipynb
- quickstart.ipynb
- User Guide:
  - user/index.md
  - user/populations.ipynb
  - user/creating.ipynb
  - user/curating.ipynb
  - user/filtering.ipynb
  - user/visualizing.ipynb
  - user/observing.ipynb
  - user/planning.ipynb
  - user/uncertainties.ipynb
  - user/shoreline.ipynb
- Developer Guide:
  - developer/index.md
  - developer/github.ipynb
  - developer/testing.ipynb
  - developer/documentation.ipynb
- API Reference:
    - api_index.md
    - Code: autoapi/ 
- acknowledgements.ipynb

theme:
  name: "material"
  icon:
    logo: material/map
  favicon: material/map
  features:
    - navigation.tracking
    - navigation.path
    - navigation.indexes
    - navigation.footer
  prev_next_buttons_location: bottom
repo_url: https://github.com/zkbt/exoatlas/
plugins:
  - search
  - mkdocs-jupyter:
      execute : True
      include_source : True
      cache: true
      cache_dir: .cache/mkdocs-jupyter
  - mkdocs-autoapi:
      autoapi_dir: exoatlas/
      autoapi_add_nav_entry: False
      autoapi_file_patterns:
        - "*.py"
      autoapi_ignore:
        - "*downloader*.py"
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: .
          options:
            docstring_style: numpy
            docstring_section_style: table
            extensions:
              - griffe_inherited_docstrings:
                  merge: true
  - exclude:
      glob:     
        - "downloads-for-exoatlas/*"
        - "details/downloads-for-exoatlas/*"
        - "*.pdf"
        - "*.fits"
        - "*.npy"
        - "*.ecsv"
markdown_extensions:
  - toc:
      permalink: "#"
      toc_depth: 1
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com

# this is super borrowed from Christina Hedges' fabulous
# https://christinahedges.github.io/astronomy_workflow/


